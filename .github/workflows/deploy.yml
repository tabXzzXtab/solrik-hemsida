# Builds the site and publishes it to GitHub Pages on every push to main.
# Build settings come from repository variables (Settings → Secrets and variables → Actions → Variables):
#   PUBLIC_SITE_URL                    the custom domain, e.g. https://www.solrik.se
#   PUBLIC_FORM_PROVIDER               custom (n8n)
#   PUBLIC_FORM_ENDPOINT_QUOTE         webhook URL for the contact/quote form
#   PUBLIC_FORM_ENDPOINT_FAULT_REPORT  webhook URL for the fault report form
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_FORM_PROVIDER: ${{ vars.PUBLIC_FORM_PROVIDER }}
          PUBLIC_FORM_ENDPOINT_QUOTE: ${{ vars.PUBLIC_FORM_ENDPOINT_QUOTE }}
          PUBLIC_FORM_ENDPOINT_FAULT_REPORT: ${{ vars.PUBLIC_FORM_ENDPOINT_FAULT_REPORT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
